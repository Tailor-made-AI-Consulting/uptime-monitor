# Hält das Repository aktiv.
#
# GitHub schaltet geplante Workflows in öffentlichen Repositories ab, wenn
# 60 Tage lang keine Aktivität stattfindet. Ein monatlicher Commit in eine
# eigene Datei verhindert das.
#
# Wichtig: Dieser Workflow darf uptime.yml nie verändern. Benachrichtigungen
# zu geplanten Läufen gehen an die Person, die die Cron-Zeile zuletzt
# geändert hat.
#
# Bewusst ohne fremde Actions: Das Repository wird nur mit git und dem
# eingebauten Token geklont, es gibt also nichts zu aktualisieren.

name: Keepalive

on:
  schedule:
    - cron: "17 4 1 * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  keepalive:
    name: Aktivität
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Zeitstempel schreiben
        env:
          TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -eu
          git clone --depth 1 "https://x-access-token:${TOKEN}@github.com/${GITHUB_REPOSITORY}.git" repo
          cd repo
          date -u +"%Y-%m-%dT%H:%M:%SZ" > .github/keepalive
          git config user.name "Keepalive"
          git config user.email "keepalive@noreply.invalid"
          git add .github/keepalive
          git commit -m "Keepalive"
          git push
